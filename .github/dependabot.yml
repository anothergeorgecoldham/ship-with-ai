version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 1
    allow:
      - dependency-name: "marked"
        dependency-type: "direct"
    labels:
      - "dependencies"
    # Repo setting "Allow auto-merge" + Agent Merge handle merging a passing
    # version-bump PR without a human click — see PRESENTER-RUNSHEET.md Beat 4.
